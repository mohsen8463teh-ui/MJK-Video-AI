name: E2E KIE Video + FFmpeg Test

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install requests

      - name: Generate two real KIE clips and assemble final MP4
        env:
          KIE_API_KEY4: ${{ secrets.KIE_API_KEY4 }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path
          import requests

          key = os.environ.get("KIE_API_KEY4")
          if not key:
              print("ERROR: GitHub secret KIE_API_KEY4 is missing.")
              sys.exit(1)

          headers = {
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
          }

          prompts = [
              "A cinematic wide shot of a modern small shop at sunset, warm realistic lighting, smooth camera movement",
              "A cinematic close-up inside the same modern small shop, products on shelves, realistic lighting, smooth camera movement",
          ]

          out_dir = Path("e2e-output")
          out_dir.mkdir(exist_ok=True)
          scene_files = []

          for index, prompt in enumerate(prompts, 1):
              payload = {
                  "model": "bytedance/v1-pro-text-to-video",
                  "input": {
                      "prompt": prompt,
                      "aspect_ratio": "16:9",
                      "resolution": "480p",
                      "duration": "5",
                      "camera_fixed": False,
                      "seed": -1,
                      "enable_safety_checker": True,
                      "nsfw_checker": False
                  }
              }

              r = requests.post(
                  "https://api.kie.ai/api/v1/jobs/createTask",
                  headers=headers,
                  json=payload,
                  timeout=60,
              )
              print(f"scene {index} createTask HTTP:", r.status_code)
              r.raise_for_status()
              body = r.json()
              task_id = (body.get("data") or {}).get("taskId")
              if not task_id:
                  print("ERROR: no taskId returned")
                  sys.exit(1)

              print(f"scene {index}: task created (ID hidden)")

              result_urls = None
              for poll in range(48):
                  time.sleep(5)
                  s = requests.get(
                      "https://api.kie.ai/api/v1/jobs/recordInfo",
                      headers={"Authorization": f"Bearer {key}"},
                      params={"taskId": task_id},
                      timeout=30,
                  )
                  s.raise_for_status()
                  info = s.json().get("data") or {}
                  state = info.get("state")
                  print(f"scene {index} poll {poll + 1}: {state}")

                  if state == "success":
                      raw = info.get("resultJson")
                      try:
                          result = json.loads(raw) if isinstance(raw, str) else raw
                      except json.JSONDecodeError:
                          result = {}
                      result_urls = result.get("resultUrls") or []
                      if not result_urls:
                          result_urls = info.get("resultUrls") or []
                      if not result_urls:
                          print("ERROR: success without result URL")
                          print(str(info)[:3000])
                          sys.exit(1)
                      break

                  if state == "fail":
                      print("ERROR: KIE generation failed")
                      print(str(info)[:3000])
                      sys.exit(1)

              if not result_urls:
                  print("ERROR: timed out waiting for KIE")
                  sys.exit(1)

              url = result_urls[0]
              target = out_dir / f"scene_{index:03d}.mp4"
              with requests.get(url, stream=True, timeout=120) as download:
                  download.raise_for_status()
                  with target.open("wb") as f:
                      for chunk in download.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              f.write(chunk)

              if not target.is_file() or target.stat().st_size == 0:
                  print("ERROR: downloaded scene is empty")
                  sys.exit(1)

              print(f"scene {index}: downloaded {target.stat().st_size} bytes")
              scene_files.append(target)

          inputs = "".join(f"[{i}:v:0]" for i in range(len(scene_files)))
          command = ["ffmpeg", "-y"]
          for path in scene_files:
              command += ["-i", str(path)]
          command += [
              "-filter_complex",
              f"{inputs}concat=n={len(scene_files)}:v=1:a=0[v]",
              "-map", "[v]",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "18",
              "-pix_fmt", "yuv420p",
              "-movflags", "+faststart",
              str(out_dir / "final.mp4"),
          ]

          print("Running FFmpeg assembly...")
          subprocess.run(command, check=True)

          final_file = out_dir / "final.mp4"
          if not final_file.is_file() or final_file.stat().st_size == 0:
              print("ERROR: final MP4 was not created")
              sys.exit(1)

          probe = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration,size",
                  "-of", "default=noprint_wrappers=1",
                  str(final_file),
              ],
              capture_output=True, text=True, check=True,
          )

          print("SUCCESS: real KIE scenes were downloaded and assembled by FFmpeg.")
          print(probe.stdout)
          PY

      - name: Upload final test MP4
        uses: actions/upload-artifact@v4
        with:
          name: MJK-KIE-FFmpeg-E2E
          path: e2e-output/final.mp4
